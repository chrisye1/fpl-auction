name: Update points

on:
  schedule:
    - cron: '7 * * * *'   # every hour, at 7 minutes past
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch points from FPL
        run: node scripts/update.mjs
      - name: Save changes
        run: |
          git config user.name "points-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/points.json
          git diff --cached --quiet || (git commit -m "Update points" && git push)
